version: '3.8'

services:
  app:
    build: .
    container_name: enrichment-service-app
    ports:
      - '3000:3000'
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/enrichment
      - RABBITMQ_URL=amqp://user-service-rabbitmq:5672
      - PORT=3000
      - NODE_ENV=development
    networks:
      - user-service-network
    depends_on:
      - mongodb

  mongodb:
    image: mongo:latest
    container_name: enrichment-service-mongodb
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    networks:
      - user-service-network

networks:
  user-service-network:
    external: true
    name: user-service_user-service-network

volumes:
  mongodb_data:
